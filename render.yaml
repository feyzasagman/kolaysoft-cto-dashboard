# Kolaysoft CTO Dashboard — Render Blueprint (portfolio / stage demo)
# Not production-grade hosting. No real secrets in this file.
#
# After first deploy:
# 1) Set DB_URL / DB_USERNAME / DB_PASSWORD from the Render Postgres dashboard (JDBC form).
# 2) Set JWT_SECRET (long random) and CORS_ALLOWED_ORIGINS (frontend https origin).
# 3) One-time: APP_DEMO_BOOTSTRAP_ENABLED=true + DEMO_ADMIN_* then disable bootstrap.
# 4) Set frontend VITE_API_BASE_URL to https://<backend-host>/api/v1 and rebuild.
#
# Docs: docs/deployment/Render_Cloud_Deployment_Guide.md

databases:
  - name: cto-dashboard-db
    plan: free
    databaseName: cto_dashboard
    user: cto_dashboard

services:
  - type: web
    name: cto-dashboard-api
    runtime: docker
    dockerfilePath: ./backend/cto-dashboard-api/Dockerfile
    dockerContext: ./backend/cto-dashboard-api
    plan: free
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_EXPIRATION_MS
        value: "3600000"
      - key: SPRINGDOC_ENABLED
        value: "false"
      - key: APP_DEMO_BOOTSTRAP_ENABLED
        value: "false"
      - key: JWT_SECRET
        sync: false
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DEMO_ADMIN_EMAIL
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false

  - type: web
    name: cto-dashboard-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
