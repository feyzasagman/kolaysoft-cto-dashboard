spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cto_dashboard}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # Geliştirme ortamında şema entity'lerden otomatik oluşturulur/güncellenir.
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    root: INFO
    com.kolaysoft.ctodashboard: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
