spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cto_dashboard}
    username: ${DB_USERNAME:postgres}
    # Yerel Docker container (cto-dashboard-postgres) POSTGRES_PASSWORD=postgres ile uyumlu.
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      # Geliştirme ortamında şema entity'lerden otomatik oluşturulur/güncellenir.
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

security:
  jwt:
    # Yalnızca local geliştirme; üretimde JWT_SECRET zorunlu verilmelidir.
    secret: ${JWT_SECRET:KolaysoftCtoDashboardDevSecretKeyForJwtSigningMustBeLongEnough}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.kolaysoft.ctodashboard: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: WARN
