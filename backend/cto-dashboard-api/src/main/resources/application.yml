spring:
  application:
    name: cto-dashboard-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  # Render injects PORT; local Docker / Maven keep SERVER_PORT or default 8080.
  port: ${PORT:${SERVER_PORT:8080}}

security:
  jwt:
    # Gerçek secret kaynak koda yazılmaz; JWT_SECRET ortam değişkeninden okunur.
    # Dev profile may supply a local fallback; prod must set JWT_SECRET explicitly.
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

app:
  cors:
    # Comma-separated exact origins. Never use "*".
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  demo:
    # Opt-in one-time portfolio ADMIN bootstrap (see DemoBootstrapInitializer). Default off.
    bootstrap-enabled: ${APP_DEMO_BOOTSTRAP_ENABLED:false}
    admin-email: ${DEMO_ADMIN_EMAIL:}
    admin-password: ${DEMO_ADMIN_PASSWORD:}
    admin-first-name: ${DEMO_ADMIN_FIRST_NAME:Demo}
    admin-last-name: ${DEMO_ADMIN_LAST_NAME:Admin}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Minimal safe Actuator exposure — do not widen without security review.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    # Only contributes Environment keys under the `info.*` prefix (not secrets).
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Kolaysoft CTO Dashboard REST API
    version: 0.0.1-SNAPSHOT
