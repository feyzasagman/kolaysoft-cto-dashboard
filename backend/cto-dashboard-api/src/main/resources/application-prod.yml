spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # Üretimde şema Flyway migration ile yönetilir; Hibernate yalnızca doğrular.
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  # Platform (Render) PORT takes precedence; local override via SERVER_PORT still works.
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework

security:
  jwt:
    # No development fallback — startup fails if JWT_SECRET is missing.
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

# Inherit management.endpoints from application.yml (health,info only; details never).
# DevDataInitializer (@Profile("dev")) does NOT run under prod.

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.kolaysoft.ctodashboard: INFO
    org.hibernate.SQL: WARN

app:
  demo:
    # Keep false in steady-state public demo. Enable once only for first ADMIN create.
    bootstrap-enabled: ${APP_DEMO_BOOTSTRAP_ENABLED:false}
