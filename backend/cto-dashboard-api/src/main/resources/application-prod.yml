spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # Üretimde şema yalnızca migration veya kontrollü süreçlerle yönetilir.
      ddl-auto: validate
    show-sql: false

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

logging:
  level:
    root: INFO
    com.kolaysoft.ctodashboard: INFO
    org.hibernate.SQL: WARN
